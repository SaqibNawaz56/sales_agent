services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 on the host: a local PostgreSQL 18 service already holds 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18+
      # images store data in a major-version subdirectory (18/docker) so that
      # pg_upgrade --link works; mounting the old path makes the image refuse to
      # start. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-3001}
    ports:
      - "${MCP_SERVER_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays in the image
      # so the Linux-built Prisma engine is never shadowed by a host install.
      - ./packages/mcp-server/src:/app/packages/mcp-server/src
      - ./packages/mcp-server/prisma:/app/packages/mcp-server/prisma

  # The local narrator's model host. OPTIONAL, and off unless asked for:
  #
  #   docker compose --profile narrator up -d
  #
  # It is behind a profile rather than always-on because the shop's own machine
  # may not have the memory to spare, and Hisaab must run without it — the
  # narrator degrades to the plain English answer when this container is absent.
  #
  # Ollama serves an OpenAI-shaped /v1/chat/completions, which is exactly what
  # narrator/narrate.ts speaks, so the application code knows nothing about it.
  #
  # The model is NOT pulled at run time. models/ holds a .gguf on the host and
  # an entrypoint registers it with Ollama on first boot — see
  # docker/narrator-entrypoint.sh and models/README.md. That keeps the whole
  # thing offline-installable, which matters for a shop machine and mattered
  # here: the network this was built on could not reach a model registry.
  narrator:
    image: ollama/ollama:latest
    profiles: ["narrator"]
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      NARRATOR_MODEL: ${NARRATOR_MODEL:-qwen2.5:1.5b}
      NARRATOR_MODEL_FILE: ${NARRATOR_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
    volumes:
      # Read-only: this container has no business writing to the weights.
      - ./models:/models:ro
      - ./docker/narrator-entrypoint.sh:/entrypoint.sh:ro
      # Ollama's own store. A named volume so re-registering is a one-off.
      - narrator-models:/root/.ollama
    ports:
      # Published so you can probe it directly — `ollama list`, a raw
      # completion — without going through the api container.
      - "${NARRATOR_PORT:-11434}:11434"
    # A hard ceiling. Docker on WSL2 gets ~4 GB in total here, and a model that
    # grew without bound would starve the database and the API rather than
    # simply failing to load. A 1.5B model at Q4_K_M needs ~1.2 GB in use;
    # 2 GB leaves headroom without inviting a bigger one in.
    mem_limit: ${NARRATOR_MEM_LIMIT:-2g}
    healthcheck:
      # Passes only once the model is registered, not merely when the server
      # is listening — so `depends_on: service_healthy` would mean something.
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q . || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # No GPU section: this machine has no CUDA, and Iris Xe is not usable by
    # Ollama. On a host with an NVIDIA card, add a deploy.resources block
    # reserving the device and it will use it without any other change.

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      # The agent runs on DeepSeek. Required.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Dictation only — DeepSeek has no audio endpoint. Optional: without it
      # the microphone is disabled and everything else still works.
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_TRANSCRIBE_MODEL: ${GROQ_TRANSCRIBE_MODEL:-whisper-large-v3}
      GROQ_TRANSCRIBE_LANGUAGE: ${GROQ_TRANSCRIBE_LANGUAGE:-en}
      # Optional local narrator. Blank by default, which disables it. With the
      # narrator profile up, http://narrator:8080/v1 reaches the container over
      # the compose network — no host install and no host.docker.internal,
      # which does not exist outside Docker Desktop.
      NARRATOR_URL: ${NARRATOR_URL:-}
      NARRATOR_MODEL: ${NARRATOR_MODEL:-qwen2.5:3b}
      NARRATOR_LANGUAGE: ${NARRATOR_LANGUAGE:-}
      NARRATOR_TIMEOUT_MS: ${NARRATOR_TIMEOUT_MS:-4000}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:3001/mcp}
      API_PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - mcp-server
    volumes:
      - ./packages/api/src:/app/packages/api/src

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Vite proxies /api across the compose network, so the browser only ever
      # talks to this origin and there is no CORS to configure.
      API_URL: http://api:3000
    ports:
      # WEB_PORT keeps its name so an existing .env keeps working; it is an
      # environment variable, not a path.
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html

volumes:
  pgdata:
  narrator-models:
