services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 on the host: a local PostgreSQL 18 service already holds 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18+
      # images store data in a major-version subdirectory (18/docker) so that
      # pg_upgrade --link works; mounting the old path makes the image refuse to
      # start. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-3001}
    ports:
      - "${MCP_SERVER_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays in the image
      # so the Linux-built Prisma engine is never shadowed by a host install.
      - ./packages/mcp-server/src:/app/packages/mcp-server/src
      - ./packages/mcp-server/prisma:/app/packages/mcp-server/prisma

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:3001/mcp}
      API_PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - mcp-server
    volumes:
      - ./packages/api/src:/app/packages/api/src

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    environment:
      # Vite proxies /api across the compose network, so the browser only ever
      # talks to this origin and there is no CORS to configure.
      API_URL: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/index.html:/app/packages/web/index.html

volumes:
  pgdata:
